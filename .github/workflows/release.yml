name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (must match .claude-plugin/plugin.json)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Tag must match the plugin version
        run: |
          VERSION=$(python -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then TAG="v${{ inputs.version }}"; else TAG="$GITHUB_REF_NAME"; fi
          test "v$VERSION" = "$TAG" || { echo "tag $TAG does not match plugin.json version $VERSION"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Tests and guardrails
        run: |
          python -m unittest discover -s tests
          python scripts/guardrails.py
      - name: Build samepage.zip and samepage.skill
        run: |
          python scripts/package_skill.py dist/samepage.zip
          cp dist/samepage.zip dist/samepage.skill
          unzip -l dist/samepage.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # On a manual run this also creates the tag on the commit being built.
        run: gh release create "$TAG" dist/samepage.zip dist/samepage.skill --target "$GITHUB_SHA" --title "samepage $TAG" --generate-notes
