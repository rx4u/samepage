name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Tag must match the plugin version
        run: |
          VERSION=$(python -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match plugin.json version $VERSION"; exit 1; }
      - name: Tests and guardrails
        run: |
          python -m unittest discover -s tests
          python scripts/guardrails.py
      - name: Build samepage.zip and samepage.skill
        run: |
          mkdir -p dist
          (cd skills && zip -qr ../dist/samepage.zip samepage)
          cp dist/samepage.zip dist/samepage.skill
          unzip -l dist/samepage.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/samepage.zip dist/samepage.skill --title "samepage $GITHUB_REF_NAME" --generate-notes
