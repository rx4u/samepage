<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="652" viewBox="0 0 1600 652"><rect width="1600" height="652" rx="28" fill="#0a0a0a"/><g clip-path="url(#c)"><clipPath id="c"><rect width="1600" height="652" rx="28"/></clipPath><defs><pattern id="d" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.5" fill="#1f1f1f"/></pattern></defs><rect width="1600" height="652" fill="url(#d)"/></g><rect x="0.5" y="0.5" width="1599" height="651" rx="27.5" fill="none" stroke="#262626"/><text x="64.0" y="92.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="600" fill="#5c5c5c" text-anchor="start" letter-spacing="3">HOW IT WORKS</text><rect x="64" y="132" width="448" height="456" rx="22" fill="#141414" stroke="#262626"/><rect x="88" y="156" width="400" height="168" rx="14" fill="#0a0a0a" stroke="#262626"/><text x="108.0" y="194.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#5c5c5c" text-anchor="start" letter-spacing="2">01</text><rect x="238" y="216" width="120" height="104" rx="10" fill="#141414" stroke="#333333"/><rect x="254" y="206" width="120" height="104" rx="10" fill="#141414" stroke="#333333"/><rect x="270" y="196" width="120" height="104" rx="10" fill="#141414" stroke="#333333"/><rect x="282" y="230" width="70" height="6" rx="3" fill="#fafafa"/><rect x="282" y="246" width="88" height="6" rx="3" fill="#333333"/><rect x="282" y="262" width="56" height="6" rx="3" fill="#333333"/><rect x="282" y="278" width="80" height="6" rx="3" fill="#333333"/><text x="282.0" y="218.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#5c5c5c" text-anchor="start" letter-spacing="0">boot.md</text><text x="96.0" y="390.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="650" fill="#fafafa" text-anchor="start" letter-spacing="0">Boot</text><text x="96.0" y="448.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="400" fill="#a3a3a3" text-anchor="start" letter-spacing="0">Every session starts</text><text x="96.0" y="490.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="400" fill="#a3a3a3" text-anchor="start" letter-spacing="0">from one small file</text><text x="96.0" y="532.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="400" fill="#a3a3a3" text-anchor="start" letter-spacing="0">of your context.</text><circle cx="532" cy="360" r="15" fill="#0a0a0a" stroke="#333333"/><path d="M531 360 l6 6 l-6 6" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-2 -6)"/><rect x="552" y="132" width="448" height="456" rx="22" fill="#141414" stroke="#262626"/><rect x="576" y="156" width="400" height="168" rx="14" fill="#0a0a0a" stroke="#262626"/><text x="596.0" y="194.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#5c5c5c" text-anchor="start" letter-spacing="2">02</text><rect x="666" y="192" width="220" height="96" rx="10" fill="#141414" stroke="#333333"/><text x="684.0" y="226.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#fafafa" text-anchor="start" letter-spacing="0">kind: ship</text><text x="684.0" y="254.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#a3a3a3" text-anchor="start" letter-spacing="0">tool: codex</text><circle cx="886" cy="288" r="22" fill="#fafafa"/><path d="M875 288 l7 7 l13 -14" fill="none" stroke="#0a0a0a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="584.0" y="390.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="650" fill="#fafafa" text-anchor="start" letter-spacing="0">Write</text><text x="584.0" y="448.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="400" fill="#a3a3a3" text-anchor="start" letter-spacing="0">The tool drafts a</text><text x="584.0" y="490.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="400" fill="#a3a3a3" text-anchor="start" letter-spacing="0">typed entry. You say</text><text x="584.0" y="532.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="400" fill="#a3a3a3" text-anchor="start" letter-spacing="0">yes. It's a commit.</text><circle cx="1020" cy="360" r="15" fill="#0a0a0a" stroke="#333333"/><path d="M1019 360 l6 6 l-6 6" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-2 -6)"/><rect x="1040" y="132" width="448" height="456" rx="22" fill="#141414" stroke="#262626"/><rect x="1064" y="156" width="400" height="168" rx="14" fill="#0a0a0a" stroke="#262626"/><text x="1084.0" y="194.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#5c5c5c" text-anchor="start" letter-spacing="2">03</text><line x1="1174" y1="240" x2="1354" y2="240" stroke="#5c5c5c" stroke-width="1.5" stroke-dasharray="4 7" stroke-linecap="round"/><path d="M1356 240 l-10 -7 v14 z" fill="#5c5c5c"/><rect x="1094" y="200" width="80" height="80" rx="20" fill="#141414" stroke="#333333"/><text x="1134.0" y="247.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="500" fill="#fafafa" text-anchor="middle" letter-spacing="0">chat</text><rect x="1354" y="200" width="80" height="80" rx="20" fill="#141414" stroke="#333333"/><text x="1394.0" y="247.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="500" fill="#fafafa" text-anchor="middle" letter-spacing="0">code</text><rect x="1219" y="188" width="90" height="36" rx="9" fill="#fafafa"/><text x="1264.0" y="212.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#0a0a0a" text-anchor="middle" letter-spacing="0">brief</text><text x="1072.0" y="390.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="650" fill="#fafafa" text-anchor="start" letter-spacing="0">Hand off</text><text x="1072.0" y="448.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="400" fill="#a3a3a3" text-anchor="start" letter-spacing="0">Leave a brief in one</text><text x="1072.0" y="490.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="400" fill="#a3a3a3" text-anchor="start" letter-spacing="0">tool. The next tool</text><text x="1072.0" y="532.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="400" fill="#a3a3a3" text-anchor="start" letter-spacing="0">picks it up.</text></svg>
